name: Publish verified v0.2.0 source

on:
  push:
    paths:
      - .github/workflows/publish-v0.2.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified source tree
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/birds-nest-v0.2.0.tar.gz
          echo '19ab5bf4283d9614c0dd03f0499f3e1f7471fed31cda000837a8473c657baf5f  /tmp/birds-nest-v0.2.0.tar.gz' | sha256sum -c -
          find . -type f -name '._*' -delete
          tar -xzf /tmp/birds-nest-v0.2.0.tar.gz
          rm -f .github/workflows/publish-v0.2.0.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish screenplay concept director v0.2.0'
          git push
