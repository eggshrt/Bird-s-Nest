name: Publish verified v0.1.0 source

on:
  push:
    paths:
      - .github/workflows/publish-v0.1.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified source tree
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/birds-nest-v0.1.0.tar.gz
          echo '5a72aa408e0b77363be10451436f2a56f17667ab344a88efd8f0d2702aa1c125  /tmp/birds-nest-v0.1.0.tar.gz' | sha256sum -c -
          tar -xzf /tmp/birds-nest-v0.1.0.tar.gz
          rm -f .github/workflows/publish-v0.1.0.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish skill orchestrator v0.1.0'
          git push
